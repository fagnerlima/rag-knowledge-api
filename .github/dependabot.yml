version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Only propose versions published at least a week ago.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "📦️ build"
      include: scope
    groups:
      spring:
        patterns:
          - "org.springframework*"
        # Major upgrades come in their own pull requests so they cannot block safe updates.
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "👷 ci"
      include: scope

  # The PostgreSQL image of compose.yaml. ComposeImageTest fails these pull requests until the same tag and digest
  # are copied to PgvectorTestDatabase, so the tests keep running on the image the app uses.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "📦️ build"
      include: scope
