version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Only propose versions published at least a week ago.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "📦️ build"
      include: scope
    groups:
      spring:
        patterns:
          - "org.springframework*"
        # Major upgrades come in their own pull requests so they cannot block safe updates.
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "👷 ci"
      include: scope
