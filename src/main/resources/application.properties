spring.application.name=rag-knowledge-api

# Local study API without authentication: listen only on this machine unless explicitly overridden.
server.address=${SERVER_ADDRESS:127.0.0.1}

# OpenAI: the key comes only from the environment (loaded by direnv from a file outside the repo).
# Empty when unset, so OpenAiApiKeyCheck stops the startup with a clear message instead of a 502 later.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}
# Caps output cost per request. For reasoning models (gpt-5 family) the cap counts hidden reasoning
# tokens too: a cap that is too low cuts the JSON reply and turns into a 502.
spring.ai.openai.chat.max-completion-tokens=${OPENAI_MAX_COMPLETION_TOKENS:3000}
spring.ai.openai.chat.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
# Only the chat model is used for now; embeddings arrive with ingestion (M1, day 2).
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
