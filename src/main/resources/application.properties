spring.application.name=rag-knowledge-api

# Local study API without authentication: listen only on this machine unless explicitly overridden.
server.address=${SERVER_ADDRESS:127.0.0.1}

# OpenAI: the key comes only from the environment (loaded by direnv from a file outside the repo).
# Empty when unset, so OpenAiApiKeyCheck stops the startup with a clear message instead of a 502 later.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}
# Caps output cost per request. For reasoning models (gpt-5 family) the cap counts hidden reasoning
# tokens too: a cap that is too low cuts the JSON reply and turns into a 502.
spring.ai.openai.chat.max-completion-tokens=${OPENAI_MAX_COMPLETION_TOKENS:3000}
spring.ai.openai.chat.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
# Embeddings for retrieval. The model fixes the vector size: changing it needs a new Flyway migration and
# re-ingesting every document (see docs/adr/0002).
spring.ai.model.embedding=openai
spring.ai.openai.embedding.model=text-embedding-3-small
# Embed only the chunk text: metadata (title, URL, license) would add noise to the vector.
spring.ai.openai.embedding.metadata-mode=none
# The other model types are not used.
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# PostgreSQL with pgvector (compose.yaml). The defaults are the synthetic local-only credentials of compose.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/ragknowledge}
spring.datasource.username=${DB_USERNAME:ragknowledge}
spring.datasource.password=${DB_PASSWORD:ragknowledge}
# Flyway owns the schema (db/migration); the vector store only checks that it matches its settings.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
